{% extends "base.html" %}
{% block content %}
<h1>Профиль {{ user_obj.username }}</h1>

{% if profile.avatar %}
  <img src="{{ profile.avatar.url }}" alt="Avatar" width="150" />
{% else %}
  <p>Аватар отсутствует.</p>
{% endif %}

{% if can_edit %}
  <a href="{% url 'myAuth:profile_edit' user_obj.pk %}">Редактировать профиль</a>
{% endif %}
{% endblock %}
