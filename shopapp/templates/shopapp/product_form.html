{% extends "shopapp/base.html" %}
{% block content %}
<h1>
    {% if object %}
        Редактировать продукт: {{ object.name }}
    {% else %}
        Создать новый продукт
    {% endif %}
</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Сохранить</button>
</form>

<a href="{% url 'shopapp:product_list' %}">Отмена</a>

{% endblock %}
