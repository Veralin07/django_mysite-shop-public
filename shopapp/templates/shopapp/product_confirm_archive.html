{% extends "shopapp/base.html" %}
{% block content %}
<h1>Архивация продукта</h1>
<p>Вы уверены, что хотите архивировать продукт: <strong>{{ product.name }}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Архивировать</button>
    <a href="{% url 'shopapp:product_detail' product.pk %}">Отменить</a>

</form>
{% endblock %}
