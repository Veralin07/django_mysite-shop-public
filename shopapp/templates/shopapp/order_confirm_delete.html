{% extends "shopapp/base.html" %}
{% block content %}
<h1>Удаление заказа</h1>
<p>Вы уверены, что хотите удалить заказ №{{ object.pk }}?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Удалить</button>
    <a href="{% url 'shopapp:order_detail' object.pk %}">Отменить</a>
</form>
{% endblock %}
